<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shakti Catering — Menu Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --ink:#232019;
  --ink-soft:#5b5546;
  --paper:#efeae0;
  --paper-raised:#f8f5ee;
  --card:#fbf9f4;
  --rule:#cdc2a8;
  --saffron:#bd8226;
  --saffron-deep:#9c6a1c;
  --herb:#4a5d45;
  --herb-deep:#374733;
  --terracotta:#c0592a;
  --shadow:0 1px 0 rgba(35,32,25,0.06),0 8px 24px -12px rgba(35,32,25,0.25);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:radial-gradient(1200px 600px at 10% -10%,#f6f1e4 0%,transparent 60%),var(--paper);
  color:var(--ink);
  font-family:'Work Sans',sans-serif;
  padding-bottom:160px;
  min-height:100vh;
}
.wrap{max-width:960px;margin:0 auto;padding:40px 20px 24px;}

/* Hero */
.hero{display:flex;flex-direction:column;gap:6px;margin-bottom:36px;border-bottom:1px solid var(--rule);padding-bottom:24px;}
.hero .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--saffron-deep);display:flex;align-items:center;gap:10px;}
.hero .eyebrow::before{content:"";width:22px;height:1px;background:var(--saffron-deep);display:inline-block;}
.hero h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(28px,5vw,46px);line-height:1.08;margin:4px 0 2px;letter-spacing:-.01em;}
.hero p{color:var(--ink-soft);font-size:14.5px;max-width:56ch;}

/* Cards */
.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);padding:22px 22px 20px;margin-bottom:24px;}

/* Setup */
.setup-grid{display:grid;grid-template-columns:2fr 1fr auto;gap:16px;align-items:end;}

/* Form elements */
label{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:5px;}
input[type=text],input[type=number],input[type=time],input[type=date],select{
  width:100%;font-family:'Work Sans',sans-serif;font-size:14px;padding:9px 11px;
  border:1px solid #d8cfb8;border-radius:7px;background:#fff;color:var(--ink);outline:none;
  transition:border-color .15s,box-shadow .15s;
}
input:focus,select:focus{border-color:var(--saffron);box-shadow:0 0 0 3px rgba(189,130,38,.15);}
.btn{font-family:'Work Sans',sans-serif;font-weight:600;font-size:13.5px;border:none;border-radius:7px;padding:10px 18px;cursor:pointer;transition:transform .12s,background .15s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--ink);color:var(--paper-raised);}
.btn-primary:hover{background:#33301f;}
.btn-sm{font-size:12px;padding:7px 12px;}
.btn-saffron{background:var(--saffron);color:#fff;}
.btn-saffron:hover{background:var(--saffron-deep);}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--rule);}
.btn-ghost:hover{background:rgba(35,32,25,.05);}
.btn-danger{background:transparent;color:var(--terracotta);border:1px solid #e0c0b4;}
.btn-danger:hover{background:#fdf5f2;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

/* Day card */
.day{background:var(--card);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);margin-bottom:24px;overflow:hidden;position:relative;}
.day::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--saffron),var(--herb));}
.day-head{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 22px 14px 26px;border-bottom:1px dashed var(--rule);flex-wrap:wrap;}
.day-head .day-num{font-family:'JetBrains Mono',monospace;color:var(--saffron-deep);font-size:12px;letter-spacing:.08em;}
.editable-title{font-family:'Fraunces',serif;font-weight:600;font-size:20px;border:none;background:transparent;outline:none;color:var(--ink);min-width:100px;max-width:260px;border-bottom:1.5px dashed transparent;padding:2px 4px;}
.editable-title:hover,.editable-title:focus{border-bottom-color:var(--saffron);}
.day-head-right{display:flex;gap:10px;align-items:end;flex-wrap:wrap;}
.day-head-right .field-sm{max-width:150px;}

.meals{padding:8px 18px 18px 24px;}

/* Meal */
.meal{border-bottom:1px solid #e7e0cd;}
.meal:last-child{border-bottom:none;}
.meal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 4px;cursor:pointer;user-select:none;flex-wrap:wrap;}
.meal-head-left{display:flex;align-items:center;gap:10px;flex:1 1 auto;min-width:0;}
.meal-caret{width:8px;height:8px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(-45deg);transition:transform .18s;flex-shrink:0;}
.meal.open .meal-caret{transform:rotate(45deg);}
.meal-label-input{font-weight:600;font-size:14.5px;border:none;background:transparent;outline:none;color:var(--ink);width:130px;border-bottom:1.5px dashed transparent;padding:1px 3px;}
.meal-label-input:hover,.meal-label-input:focus{border-bottom-color:var(--saffron);}
.meal-count{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--herb-deep);background:#e7ecdf;border-radius:20px;padding:2px 8px;flex-shrink:0;}
.meal-count.zero{color:var(--ink-soft);background:#eee9db;}
.meal-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.meal-meta input[type=time]{width:105px;font-size:12.5px;padding:6px 8px;}
.meal-meta input[type=number]{width:75px;font-size:12.5px;padding:6px 8px;}
.meal-meta .sep{font-size:11px;color:var(--ink-soft);}
.meal-price-wrap{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.meal-price-wrap span{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);}
.meal-price-wrap input{width:85px;font-family:'JetBrains Mono',monospace;font-size:12.5px;padding:6px 8px;}
.meal-actions{display:flex;gap:6px;align-items:center;}

.dish-panel{max-height:0;overflow:hidden;transition:max-height .3s ease;}
.meal.open .dish-panel{max-height:2000px;}
.dish-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;padding:2px 4px 12px;}
.dish-chip{display:flex;align-items:center;gap:7px;border:1px solid #ddd4bb;background:#fff;border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer;transition:border-color .12s,background .12s;}
.dish-chip:hover{border-color:var(--saffron);}
.dish-chip input[type=checkbox]{width:14px;height:14px;accent-color:var(--herb-deep);flex-shrink:0;}
.dish-chip.checked{background:#f2ede1;border-color:var(--saffron-deep);}
.custom-dish-row{display:flex;gap:8px;padding:4px 4px 14px;flex-wrap:wrap;}
.custom-dish-row input{flex:1;min-width:140px;}

/* Add meal / day buttons */
.add-meal-row{padding:8px 18px 16px 24px;}
.add-day-row{text-align:center;margin-bottom:30px;}

/* Summary bar */
.summary-bar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--paper-raised);padding:14px 20px;display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;box-shadow:0 -8px 24px -8px rgba(0,0,0,.35);z-index:20;}
.summary-bar .summary-row{display:flex;align-items:center;gap:20px;}
.summary-item{display:flex;flex-direction:column;gap:2px;}
.summary-item .label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#c9c2ab;margin-bottom:0;}
.summary-item .value{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:600;}
.summary-bar .btn-saffron{padding:11px 22px;}
.summary-bar .btn-saffron:disabled{opacity:.4;cursor:not-allowed;}
.guests-inline{display:flex;align-items:center;gap:6px;}
.guests-inline label{margin:0;white-space:nowrap;color:#c9c2ab;}
.guests-inline input{width:80px;padding:7px 8px;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff;}

.empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft);}
.empty-state h3{font-family:'Fraunces',serif;font-size:20px;color:var(--ink);margin-bottom:6px;font-weight:600;}

/* Mobile */
@media(max-width:680px){
  .setup-grid{grid-template-columns:1fr;gap:12px;}
  .setup-grid .btn{width:100%;justify-content:center;}
}
@media(max-width:600px){
  body{padding-bottom:260px;}
  .wrap{padding:24px 14px 16px;}
  .hero{margin-bottom:24px;padding-bottom:18px;}
  .day-head{padding:14px 14px 12px 18px;}
  .day-head-right{width:100%;}
  .day-head-right .field-sm{max-width:none;flex:1;}
  .meals{padding:6px 10px 14px 14px;}
  .meal-head{display:grid;grid-template-columns:1fr;row-gap:8px;}
  .meal-meta{width:100%;}
  .meal-price-wrap{width:100%;}
  .meal-price-wrap input{width:100%;}
  .dish-grid{grid-template-columns:1fr 1fr;gap:7px;}
  .summary-bar{
    flex-direction:column;
    align-items:stretch;
    gap:10px;
    padding:12px 14px calc(14px + env(safe-area-inset-bottom));
  }
  .summary-bar .summary-row{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:8px;
    width:100%;
  }
  .summary-bar .summary-row:last-child{
    grid-template-columns:1fr 1fr;
  }
  .summary-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1px;
  }
  .summary-item .label{font-size:9px;}
  .summary-item .value{font-size:13px;}
  .summary-bar .btn-saffron{
    width:100%;
    justify-content:center;
    padding:11px 16px;
    font-size:12.5px;
  }
}
@media(max-width:380px){.dish-grid{grid-template-columns:1fr;}}
@media(prefers-reduced-motion:reduce){*{transition:none !important;}}

/* Saved clients */
.saved-clients{margin-bottom:24px;}
.saved-clients h3{font-family:'Fraunces',serif;font-weight:600;font-size:18px;margin-bottom:12px;}
.client-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;}
.client-card{
  background:var(--card);border:1px solid var(--rule);border-radius:10px;
  padding:14px 16px;cursor:pointer;transition:border-color .15s,box-shadow .15s;
  display:flex;justify-content:space-between;align-items:center;gap:10px;
}
.client-card:hover{border-color:var(--saffron);box-shadow:0 2px 12px -4px rgba(189,130,38,.25);}
.client-card-info{min-width:0;}
.client-card-name{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.client-card-meta{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
.client-card-actions{display:flex;gap:6px;flex-shrink:0;}
.client-card-actions .btn{padding:6px 10px;font-size:11px;}
.no-clients{color:var(--ink-soft);font-size:14px;padding:16px 0;}

/* Toast */
.toast{
  position:fixed;top:20px;right:20px;z-index:100;
  background:var(--ink);color:var(--paper-raised);
  padding:12px 20px;border-radius:9px;font-size:13.5px;font-weight:500;
  box-shadow:0 8px 24px -8px rgba(0,0,0,.4);
  transform:translateY(-20px);opacity:0;
  transition:transform .25s,opacity .25s;pointer-events:none;
}
.toast.show{transform:translateY(0);opacity:1;}
.toast.error{background:var(--terracotta);}
.toast.success{background:var(--herb-deep);}

/* Save button in summary */
.btn-save{background:var(--herb);color:#fff;}
.btn-save:hover{background:var(--herb-deep);}

@media(max-width:600px){
  .client-list{grid-template-columns:1fr;}
  .summary-bar .summary-row.save-row{grid-template-columns:1fr 1fr 1fr;}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="hero">
    <div class="eyebrow">Shakti Catering &amp; Events</div>
    <h1>Menu Planner</h1>
    <p>A gift by Ujjwal to Atul Modi <3</p>
  </div>

  <div class="saved-clients" id="savedClientsSection">
    <h3>Saved Clients</h3>
    <div class="client-list" id="clientList">
      <div class="no-clients" id="noClients">Loading saved clients...</div>
    </div>
  </div>

  <div class="card setup">
    <div class="setup-grid">
      <div>
        <label for="clientName">Client name</label>
        <input type="text" id="clientName" placeholder="e.g. Sri Sanjay Chaparia Ji">
      </div>
      <div>
        <label for="numDays">No. of days</label>
        <input type="number" id="numDays" min="1" max="14" value="1">
      </div>
      <div>
        <button class="btn btn-primary" id="buildBtn">Build days</button>
      </div>
    </div>
  </div>

  <div id="daysContainer">
    <div class="empty-state">
      <h3>No days set up yet</h3>
      <div>Enter a client name and number of days, then click "Build days".</div>
    </div>
  </div>
</div>

<div class="summary-bar">
  <div class="summary-row">
    <div class="summary-item">
      <div class="label">Dishes</div>
      <div class="value" id="sumDishes">0</div>
    </div>
    <div class="summary-item">
      <div class="label">Total / plate</div>
      <div class="value" id="sumPerPlate">₹0</div>
    </div>
    <div class="summary-item">
      <div class="label">Grand total</div>
      <div class="value" id="sumGrand">—</div>
    </div>
  </div>
  <div class="summary-row save-row">
    <button class="btn btn-save" id="saveBtn" onclick="saveClient()">☁ Save Client</button>
    <button class="btn btn-saffron" id="pdfQuoteBtn" disabled>Quotation PDF</button>
    <button class="btn btn-saffron" id="pdfMenuBtn" disabled>Menu PDF</button>
  </div>
</div>

        console.error('OpenAI error:', err);
        continue;
      }

      // const data = await resp.json();
      // let text = (data.choices?.[0]?.message?.content||'').trim();
      // text = text.replace(/```json\s*/gi,'').replace(/```\s*/gi,'').trim();

      // const items = JSON.parse(text);
      const items = await resp.json();

      items.forEach(item => {
        dishInfoCache[item.name] = {
          desc: item.desc || '',
          nutrition: `${item.cal||'—'} kcal  ·  ${item.protein||'—'}g protein  ·  ${item.carbs||'—'}g carbs  ·  ${item.fat||'—'}g fat`
        };
      });
    } catch(e){
      console.error('Failed to fetch dish info batch:', e);
    }
  }
  return dishInfoCache;
}

let days = [];

/* =========================================================================

document.getElementById('buildBtn').addEventListener('click',()=>{
  const n = Math.max(1,Math.min(14,parseInt(document.getElementById('numDays').value)||1));
  document.getElementById('numDays').value = n;
  const newDays = [];
  for(let i=0;i<n;i++) newDays.push(days[i]||makeEmptyDay(i));
  days = newDays;
  renderAll();
});

/* =========================================================================

   ========================================================================= */
function renderAll(){
  const c = document.getElementById('daysContainer');
  c.innerHTML = '';
  if(!days.length){
    c.innerHTML = '<div class="empty-state"><h3>No days set up yet</h3><div>Enter a client name and number of days, then click "Build days".</div></div>';
    updateSummary(); return;
  }
  days.forEach((day,dIdx)=>{
    const el = document.createElement('div'); el.className='day';

    // Head
    const head = document.createElement('div'); head.className='day-head';
    head.innerHTML = `
      <div>
        <div class="day-num">DAY ${dIdx+1} OF ${days.length}</div>
        <input type="text" class="editable-title" value="${esc(day.label)}" data-d="${dIdx}" title="Click to edit day label">
      </div>
      <div class="day-head-right">
        <div class="field-sm"><label>Date</label><input type="date" data-d="${dIdx}" class="day-date-in"></div>
      </div>`;
    head.querySelector('.editable-title').addEventListener('input',e=>{days[dIdx].label=e.target.value;});
    const dateIn = head.querySelector('.day-date-in'); dateIn.value=day.date;
    dateIn.addEventListener('change',e=>{days[dIdx].date=e.target.value;});
    el.appendChild(head);

    // Meals
    const mealsWrap = document.createElement('div'); mealsWrap.className='meals';
    day.meals.forEach((meal,mIdx)=>{
      mealsWrap.appendChild(buildMealEl(dIdx,mIdx,meal));
    });
    el.appendChild(mealsWrap);

    // Add meal button
    const addRow = document.createElement('div'); addRow.className='add-meal-row';
    const addBtn = document.createElement('button');
    addBtn.className='btn btn-ghost btn-sm';
    addBtn.textContent='+ Add meal slot';
    addBtn.addEventListener('click',()=>{
      days[dIdx].meals.push({
        label:'Custom Meal', key:'lunch', startTime:'', endTime:'', pax:'',
        price:'', dishes:new Set(), customDishes:[]
      });
      renderAll();
    });
    addRow.appendChild(addBtn);
    el.appendChild(addRow);

    c.appendChild(el);
  });

  // Add day button
  const addDayRow = document.createElement('div'); addDayRow.className='add-day-row';
  const addDayBtn = document.createElement('button');
  addDayBtn.className='btn btn-ghost';
  addDayBtn.textContent='+ Add another day';
  addDayBtn.addEventListener('click',()=>{
    days.push(makeEmptyDay(days.length));
    document.getElementById('numDays').value = days.length;
    renderAll();
  });
  addDayRow.appendChild(addDayBtn);
  c.appendChild(addDayRow);

  updateSummary();
}

function buildMealEl(dIdx,mIdx,meal){
  const el = document.createElement('div');
  el.className='meal';

  // Head
  const mHead = document.createElement('div'); mHead.className='meal-head';
  mHead.innerHTML = `
    <div class="meal-head-left">
      <span class="meal-caret"></span>
      <input type="text" class="meal-label-input" value="${esc(meal.label)}" title="Edit meal label">
      <span class="meal-count ${totalDishCount(meal)===0?'zero':''}">${totalDishCount(meal)}</span>
    </div>
    <div class="meal-meta">
      <input type="time" placeholder="Start" title="Start time" class="m-start" value="${meal.startTime}">
      <span class="sep">to</span>
      <input type="time" placeholder="End" title="End time" class="m-end" value="${meal.endTime}">
      <input type="number" min="0" placeholder="PAX" title="No. of guests" class="m-pax" value="${meal.pax}">
    </div>
    <div class="meal-price-wrap">
      <span>₹</span>
      <input type="number" min="0" step="1" placeholder="Price" class="m-price" value="${meal.price}">
    </div>
    <div class="meal-actions">
      <button class="btn btn-danger btn-sm m-del" title="Remove this meal">✕</button>
    </div>`;

  // Events on head inputs (stop propagation so they don't toggle panel)
  mHead.querySelectorAll('input,button').forEach(inp=>inp.addEventListener('click',e=>e.stopPropagation()));
  mHead.querySelector('.meal-label-input').addEventListener('input',e=>{days[dIdx].meals[mIdx].label=e.target.value;});
  mHead.querySelector('.m-start').addEventListener('change',e=>{days[dIdx].meals[mIdx].startTime=e.target.value;});
  mHead.querySelector('.m-end').addEventListener('change',e=>{days[dIdx].meals[mIdx].endTime=e.target.value;});
  mHead.querySelector('.m-pax').addEventListener('input',e=>{days[dIdx].meals[mIdx].pax=e.target.value;});
  mHead.querySelector('.m-price').addEventListener('input',e=>{days[dIdx].meals[mIdx].price=e.target.value;updateSummary();});
  mHead.querySelector('.m-del').addEventListener('click',()=>{
    if(days[dIdx].meals.length<=1) return;
    days[dIdx].meals.splice(mIdx,1); renderAll();
  });

  mHead.addEventListener('click',e=>{
    if(e.target.closest('input')||e.target.closest('button')) return;
    el.classList.toggle('open');
  });
  el.appendChild(mHead);

  // Dish panel
  const panel = document.createElement('div'); panel.className='dish-panel';

  // Dish category selector
  const catRow = document.createElement('div');
  catRow.style.cssText='padding:6px 4px 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;';
  catRow.innerHTML = `<label style="margin:0;white-space:nowrap;">Show dishes from:</label>
    <select class="cat-select" style="width:auto;min-width:150px;">
      <option value="breakfast">Breakfast</option>
      <option value="lunch">Lunch</option>
      <option value="eveningSnacks">Evening Snacks</option>
      <option value="dinner">Dinner</option>
    </select>`;
  const catSel = catRow.querySelector('.cat-select');
  catSel.value = meal.key;
  catSel.addEventListener('change',e=>{
    days[dIdx].meals[mIdx].key = e.target.value;
    renderDishGrid(grid, dIdx, mIdx);
  });
  panel.appendChild(catRow);

  // Grid
  const grid = document.createElement('div'); grid.className='dish-grid';
  renderDishGrid(grid, dIdx, mIdx);
  panel.appendChild(grid);

  // Custom dish input
  const customRow = document.createElement('div'); customRow.className='custom-dish-row';
  customRow.innerHTML = `<input type="text" placeholder="Add custom dish..." class="custom-in"><button class="btn btn-ghost btn-sm custom-add">+ Add</button>`;
  const customIn = customRow.querySelector('.custom-in');
  const customAddBtn = customRow.querySelector('.custom-add');
  function addCustom(){
    const v = customIn.value.trim();
    if(!v) return;
    days[dIdx].meals[mIdx].customDishes.push(v);
    days[dIdx].meals[mIdx].dishes.add(v);
    customIn.value='';
    renderDishGrid(grid, dIdx, mIdx);
    mHead.querySelector('.meal-count').textContent = totalDishCount(days[dIdx].meals[mIdx]);
    mHead.querySelector('.meal-count').classList.toggle('zero',totalDishCount(days[dIdx].meals[mIdx])===0);
    updateSummary();
  }
  customAddBtn.addEventListener('click',addCustom);
  customIn.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addCustom();}});
  panel.appendChild(customRow);

  el.appendChild(panel);
  return el;
}

function renderDishGrid(grid, dIdx, mIdx){
  grid.innerHTML='';
  const meal = days[dIdx].meals[mIdx];
  const dishes = DISH_DATA[meal.key]||[];
  const allDishes = [...dishes, ...meal.customDishes.filter(d=>!dishes.includes(d))];
  allDishes.forEach(dish=>{
    const checked = meal.dishes.has(dish);
    const chip = document.createElement('label');
    chip.className='dish-chip'+(checked?' checked':'');
    chip.innerHTML=`<input type="checkbox" ${checked?'checked':''}> <span>${esc(dish)}</span>`;
    chip.querySelector('input').addEventListener('change',e=>{
      if(e.target.checked){ meal.dishes.add(dish); chip.classList.add('checked'); }
      else { meal.dishes.delete(dish); chip.classList.remove('checked'); }
      const mHead = grid.closest('.meal').querySelector('.meal-count');
      mHead.textContent=totalDishCount(meal);
      mHead.classList.toggle('zero',totalDishCount(meal)===0);
      updateSummary();
    });
    grid.appendChild(chip);
  });
}

function totalDishCount(meal){ return meal.dishes.size; }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* =========================================================================
   SUMMARY
   ========================================================================= */
function updateSummary(){
  let td=0, tp=0;
  days.forEach(d=>d.meals.forEach(m=>{td+=m.dishes.size; tp+=parseFloat(m.price)||0;}));
  document.getElementById('sumDishes').textContent=td;
  document.getElementById('sumPerPlate').textContent='₹'+tp.toLocaleString('en-IN');
  // Grand total = sum of (price per plate × PAX) for each meal that has both
  let grand = 0;
  let hasGrand = false;
  days.forEach(d=>d.meals.forEach(m=>{
    const price = parseFloat(m.price)||0;
    const pax = parseFloat(m.pax)||0;
    if(price>0 && pax>0){ grand += price * pax; hasGrand = true; }
  }));
  document.getElementById('sumGrand').textContent = hasGrand ? '₹'+Math.round(grand).toLocaleString('en-IN') : '—';
  const client = document.getElementById('clientName').value.trim();
  document.getElementById('pdfQuoteBtn').disabled = !(days.length && td && client);
  document.getElementById('pdfMenuBtn').disabled = !(days.length && td && client);
}
document.getElementById('clientName').addEventListener('input',updateSummary);

function fmtDate(iso){
  if(!iso) return '';
  const d=new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
}
function fmtTime12(t){
  if(!t) return '';
  const [h,m]=t.split(':').map(Number);
  const ampm=h>=12?'PM':'AM';
  const h12=h%12||12;
  return `${String(h12).padStart(2,'0')}:${String(m).padStart(2,'0')}${ampm}`;
}

function generateMenuPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const W = doc.internal.pageSize.getWidth();
  const H = doc.internal.pageSize.getHeight();
  const mx = 50;
  const hasInfo = Object.keys(dishInfoCache).length > 0;

  const clientName = document.getElementById('clientName').value.trim()||'Client';

  const inkC = [35,32,25];
  const saffC = [192,89,42];
  const brownC = [139,90,43];
  const softC = [110,102,84];
  const ingredC = [120,100,65];
  const nutriC = [90,120,85];

  // ===== COVER PAGE =====
  doc.setFillColor(245,240,230);
  doc.rect(0,0,W,H,'F');

  doc.setDrawColor(192,89,42);
  doc.setLineWidth(2);
  doc.line(mx,60,W-mx,60);

  doc.setFont('times','bolditalic');
  doc.setFontSize(14);
  doc.setTextColor(...brownC);
  doc.text('|| Shri Ganeshaya Namah ||', W/2, 45, {align:'center'});

  doc.setFont('times','italic');
  doc.setFontSize(13);
  doc.setTextColor(...inkC);
  const welcomeText = '"A Feast of Love Begins Here"\nWelcome to a celebration woven with warmth, flavor, and unforgettable moments. At Shakti Catering & Events, we are honored to be part of your special day. As you gather with loved ones to toast to togetherness, we invite you to enjoy our thoughtfully curated Wedding menu\u2014a reflection of tradition, taste, and timeless joy.\nLet each dish serve as a symbol of the care and creativity we bring to every event. Here\'s to a culinary journey that fills your heart as much as your plate.';
  const lines = doc.splitTextToSize(welcomeText, W - mx*2);
  doc.text(lines, W/2, 90, {align:'center', lineHeightFactor:1.55});

  const ovalY = 340;
  doc.setFillColor(210,190,150);
  doc.setDrawColor(90,65,30);
  doc.setLineWidth(3);
  doc.ellipse(W/2, ovalY+80, 200, 110, 'FD');

  doc.setFont('times','bold');
  doc.setFontSize(28);
  doc.setTextColor(...inkC);
  doc.text(clientName, W/2, ovalY+40, {align:'center'});

  const allDates = days.filter(d=>d.date).map(d=>fmtDate(d.date));
  if(allDates.length){
    doc.setFontSize(20);
    doc.text(allDates.join(' - '), W/2, ovalY+80, {align:'center'});
  }

  doc.setFontSize(16);
  doc.setFont('times','normal');
  doc.text(`${days.length} Day${days.length>1?'s':''} Event`, W/2, ovalY+115, {align:'center'});

  addFooterWithLogo(doc, W, H, true);

  // ===== MEAL PAGES =====
  // Height per dish: with info ~80pt, without ~36pt
  const dishHeight = hasInfo ? 80 : 36;
  const footerZone = 140;

  days.forEach((day, dIdx) => {
    day.meals.forEach((meal, mIdx) => {
      if(meal.dishes.size===0) return;
      doc.addPage();

      doc.setFillColor(245,240,230);
      doc.rect(0,0,W,H,'F');

      let y = 50;

      // Meal label
      doc.setFont('times','bold');
      doc.setFontSize(26);
      doc.setTextColor(...saffC);
      doc.text(meal.label.toUpperCase(), W/2, y, {align:'center'});
      y += 38;

      // Date / Time line
let meta = '';

if(day.date) meta += fmtDate(day.date);

if(meal.startTime){
  if(meta) meta += ' | ';
  meta += fmtTime12(meal.startTime);
  if(meal.endTime) meta += ' - '+fmtTime12(meal.endTime);
}

      if(meta.trim()){
        doc.setFont('times','bold');
        doc.setFontSize(18);
        doc.setTextColor(...inkC);
        doc.text(meta.trim(), W/2, y, {align:'center'});
        y += 14;
      }

      // Decorative line
      doc.setDrawColor(...saffC);
      doc.setLineWidth(1.5);
      doc.line(mx, y+6, W-mx, y+6);
      y += 30;

      // Dishes with description & nutrition
      const allDishes = Array.from(meal.dishes);
      const contentWidth = W - mx*2 - 30;

      allDishes.forEach((dishName, dishIdx) => {
        // Page break check
        if(y > H - footerZone - dishHeight){
          addFooterWithLogo(doc,W,H,false);
          doc.addPage();
          doc.setFillColor(245,240,230);
          doc.rect(0,0,W,H,'F');
          y = 50;
        }

        // Dish name
        doc.setFont('times','bold');
        doc.setFontSize(16);
        doc.setTextColor(...saffC);
        doc.text(dishName, mx+10, y);

        const info = dishInfoCache[dishName];
        if(info){
          y += 16;

          // Fancy description line
          if(info.desc){
            doc.setFont('times','italic');
            doc.setFontSize(10);
            doc.setTextColor(...ingredC);
            const descLines = doc.splitTextToSize(info.desc, contentWidth);
            const showLines = descLines.slice(0, 2);
            doc.text(showLines, mx+14, y);
            y += showLines.length * 13;
          }

          // Nutrition line
          if(info.nutrition){
            doc.setFont('helvetica','normal');
            doc.setFontSize(7.5);
            doc.setTextColor(...nutriC);
            doc.text(info.nutrition, mx+14, y+2);
            y += 12;
          }

          // Elegant thin separator between dishes
          if(dishIdx < allDishes.length - 1){
            y += 6;
            doc.setDrawColor(200,190,165);
            doc.setLineWidth(0.3);
            const sepW = 80;
            doc.line(W/2 - sepW/2, y, W/2 + sepW/2, y);
            // Small diamond in center
            const cx = W/2, cy = y;
            doc.setFillColor(200,190,165);
            doc.triangle(cx, cy-2.5, cx+2.5, cy, cx, cy+2.5, 'F');
            doc.triangle(cx, cy-2.5, cx-2.5, cy, cx, cy+2.5, 'F');
            y += 12;
          } else {
            y += 14;
          }

        } else {
          // No AI info — just dish name with spacing
          y += 8;

          // Simple dot separator between dishes
          if(dishIdx < allDishes.length - 1){
            y += 4;
            doc.setFillColor(200,190,165);
            doc.circle(W/2, y, 1.5, 'F');
            y += 10;
          } else {
            y += 10;
          }
        }
      });

      addFooterWithLogo(doc,W,H,false);
    });
  });

  // Page numbers
  const pc = doc.internal.getNumberOfPages();
  for(let p=1;p<=pc;p++){
    doc.setPage(p);
    doc.setFont('helvetica','normal');
    doc.setFontSize(8);
    doc.setTextColor(...softC);
  }

  const safeClient = clientName.replace(/[^a-z0-9]+/gi,'_').replace(/^_+|_+$/g,'')||'menu';
  doc.save(`Menu_${safeClient}.pdf`);
}

document.getElementById('pdfQuoteBtn').addEventListener('click', generateQuotePDF);

function generateQuotePDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const W = doc.internal.pageSize.getWidth();
  const H = doc.internal.pageSize.getHeight();
  const mx = 40;

  const inkRGB=[35,32,25], saffRGB=[157,106,28], herbRGB=[74,93,69], softRGB=[110,102,84], ruleRGB=[205,194,168];
  const clientName = document.getElementById('clientName').value.trim()||'Client';

  // Header
  doc.setFillColor(...inkRGB);
  doc.rect(0,0,W,86,'F');
  doc.setTextColor(240,235,220);
  doc.setFont('times','bold');
  doc.setFontSize(22);
  doc.text('Catering Menu Quotation', mx, 40);
  doc.setFont('helvetica','normal');
  doc.setFontSize(10.5);
  doc.setTextColor(210,195,160);
  doc.text('Shakti Catering & Events | '+new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'}), mx, 60);

  // Logo in header
  try { doc.addImage(LOGO_B64,'PNG',W-mx-70,12,60,60); } catch(e){}

  let y=112;
  doc.setTextColor(...inkRGB);
  doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.text('Client', mx, y);
  doc.setFont('helvetica','normal'); doc.setFontSize(12);
  doc.text(clientName, mx+55, y);
  doc.setFont('helvetica','bold');
  doc.text('Duration',W-mx-160,y);
  doc.setFont('helvetica','normal');
  doc.text(`${days.length} day${days.length>1?'s':''}`,W-mx-80,y);
  y+=18;
  doc.setDrawColor(...ruleRGB); doc.line(mx,y+4,W-mx,y+4); y+=26;

  let grandTotalPerPlate=0;
  let grandTotalAmount=0;
  days.forEach((day,idx)=>{
    if(y>700){doc.addPage();y=50;}
    const dayLabel=`${day.label}`+(day.date?`  ·  ${fmtDate(day.date)}`:'');
    doc.setFillColor(...saffRGB);
    doc.roundedRect(mx,y-14,16,16,3,3,'F');
    doc.setFont('times','bold'); doc.setFontSize(14); doc.setTextColor(...inkRGB);
    doc.text(dayLabel,mx+24,y); y+=10;

    const body=[];
    let dayTotal=0;
    let dayGrand=0;
    day.meals.forEach(meal=>{
      if(meal.dishes.size===0) return;
      const price=parseFloat(meal.price)||0;
      const pax=parseFloat(meal.pax)||0;
      dayTotal+=price;
      grandTotalPerPlate+=price;
      if(price>0 && pax>0){ dayGrand+=price*pax; grandTotalAmount+=price*pax; }
      let label=meal.label;
      if(meal.startTime) label+=`\n${fmtTime12(meal.startTime)}${meal.endTime?' - '+fmtTime12(meal.endTime):''}`;
      if(meal.pax) label+=`\n${meal.pax} Pax`;
      body.push([label, Array.from(meal.dishes).join(', '), price?`Rs. ${price.toLocaleString('en-IN')}`:'—']);
    });
    if(!body.length) body.push(['—','No dishes selected','—']);

    doc.autoTable({
      startY:y+4, head:[['Meal','Dishes','Price / Plate']], body:body,
      margin:{left:mx,right:mx},
      styles:{font:'helvetica',fontSize:9,cellPadding:7,textColor:inkRGB,lineColor:ruleRGB,lineWidth:.6,valign:'top'},
      headStyles:{fillColor:inkRGB,textColor:[240,235,220],fontStyle:'bold',fontSize:9.5},
      alternateRowStyles:{fillColor:[248,245,238]},
      columnStyles:{0:{cellWidth:100,fontStyle:'bold'},1:{cellWidth:W-mx*2-100-90},2:{cellWidth:90,halign:'right'}},
      didDrawPage:data=>{y=data.cursor.y;}
    });
    y=doc.lastAutoTable.finalY+20;
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(...herbRGB);
    doc.text(`${day.label} total per plate: Rs. ${dayTotal.toLocaleString('en-IN')}`,W-mx,y,{align:'right'});
    y+=30;
  });

  // Grand total
  if(y>720){doc.addPage();y=60;}
  doc.setDrawColor(...ruleRGB); doc.line(mx,y,W-mx,y); y+=24;
  const hasGrand = grandTotalAmount > 0;
  const boxL=W-mx-260, boxW=260, boxH=hasGrand?88:38;
  doc.setFillColor(...inkRGB);
  doc.roundedRect(boxL,y-20,boxW,boxH,8,8,'F');
  doc.setTextColor(240,235,220);
  doc.setFont('helvetica','bold'); doc.setFontSize(11);
  doc.text('Total per plate (all days)',boxL+20,y-3);
  doc.setFontSize(13);
  doc.text(`Rs. ${grandTotalPerPlate.toLocaleString('en-IN')}`,boxL+boxW-20,y-3,{align:'right'});
  if(hasGrand){
    doc.setDrawColor(90,84,66); doc.setLineWidth(.6);
    doc.line(boxL+20,y+10,boxL+boxW-20,y+10);
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
    doc.text('Grand total (price \u00D7 guests)',boxL+20,y+30);
    doc.setFont('helvetica','bold'); doc.setFontSize(15);
    doc.text(`Rs. ${Math.round(grandTotalAmount).toLocaleString('en-IN')}`,boxL+boxW-20,y+54,{align:'right'});
  }

  // Footer on all pages
  const pc=doc.internal.getNumberOfPages();
  for(let p=1;p<=pc;p++){
    doc.setPage(p);
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...softRGB);
    doc.text(`Page ${p} of ${pc}`,W-mx,H-24,{align:'right'});
    doc.text('Shakti Catering & Events | 8934020403 | 9889815000',mx,H-24);
  }
  const safe=clientName.replace(/[^a-z0-9]+/gi,'_').replace(/^_+|_+$/g,'')||'quote';
  doc.save(`Quotation_${safe}.pdf`);
}

let db = null;
function initFirebase(){
  if(!FIREBASE_CONFIG.apiKey){
    document.getElementById('clientList').innerHTML =
      '<div class="no-clients">Firebase not configured. Add your config in the code to enable cloud save.</div>';
    return false;
  }

    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    return true;
  } catch(e){ console.error('Firebase init error:', e); return false; }

/* =========================================================================
   TOAST
   ========================================================================= */
let toastEl = document.createElement('div');
toastEl.className = 'toast';
document.body.appendChild(toastEl);
let toastTimer = null;

function showToast(msg, type='success'){
  toastEl.textContent = msg;
  toastEl.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ toastEl.className = 'toast'; }, 3000);
}

/* =========================================================================
   SERIALIZE / DESERIALIZE STATE
   ========================================================================= */
function serializeState(){
  const clientName = document.getElementById('clientName').value.trim();
  return {
    clientName,
    numDays: days.length,
    savedAt: new Date().toISOString(),
    days: days.map(d => ({
      label: d.label,
      date: d.date,
      meals: d.meals.map(m => ({
        label: m.label,
        key: m.key,
        startTime: m.startTime,
        endTime: m.endTime,
        pax: m.pax,
        price: m.price,
        dishes: Array.from(m.dishes),
        customDishes: m.customDishes
      }))
    }))
  };
}

function deserializeState(data){
  document.getElementById('clientName').value = data.clientName || '';
  document.getElementById('numDays').value = data.numDays || 1;
  days = (data.days || []).map(d => ({
    label: d.label || 'Day',
    date: d.date || '',
    meals: (d.meals || []).map(m => ({
      label: m.label || '',
      key: m.key || 'lunch',
      startTime: m.startTime || '',
      endTime: m.endTime || '',
      pax: m.pax || '',
      price: m.price || '',
      dishes: new Set(m.dishes || []),
      customDishes: m.customDishes || []
    }))
  }));
  renderAll();
}

/* =========================================================================
   SAVE CLIENT
   ========================================================================= */
async function saveClient(){
  if(!db){ showToast('Firebase not configured!','error'); return; }
  const clientName = document.getElementById('clientName').value.trim();
  if(!clientName){ showToast('Enter a client name first','error'); return; }
  if(days.length===0){ showToast('Build days first','error'); return; }

  const data = serializeState();
  const docId = clientName.replace(/[^a-z0-9]+/gi,'_').toLowerCase();

  try {
    await db.collection('clients').doc(docId).set(data);
    showToast(`"${clientName}" saved to cloud!`);
    loadClientList();
  } catch(e){
    console.error('Save error:', e);
    showToast('Save failed: ' + e.message, 'error');
  }
}

/* =========================================================================
   LOAD CLIENT LIST
   ========================================================================= */
async function loadClientList(){
  if(!db) return;
  const listEl = document.getElementById('clientList');

  try {
    const snapshot = await db.collection('clients').orderBy('savedAt','desc').get();

    if(snapshot.empty){
      listEl.innerHTML = '<div class="no-clients">No saved clients yet. Build a menu and click Save.</div>';
      return;
    }

    listEl.innerHTML = '';
    snapshot.forEach(doc => {
      const d = doc.data();
      const card = document.createElement('div');
      card.className = 'client-card';

      const savedDate = d.savedAt ? new Date(d.savedAt).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) : '';
      const mealCount = (d.days||[]).reduce((sum,day) => sum + (day.meals||[]).length, 0);

      card.innerHTML = `
        <div class="client-card-info">
          <div class="client-card-name">${esc(d.clientName||doc.id)}</div>
          <div class="client-card-meta">${d.numDays||0} day${(d.numDays||0)>1?'s':''} · ${mealCount} meals · ${savedDate}</div>
        </div>
        <div class="client-card-actions">
          <button class="btn btn-saffron btn-sm load-btn">Load</button>
          <button class="btn btn-danger btn-sm del-btn">Delete</button>
        </div>`;

      card.querySelector('.load-btn').addEventListener('click', () => loadClient(doc.id));
      card.querySelector('.del-btn').addEventListener('click', () => deleteClient(doc.id, d.clientName));
      listEl.appendChild(card);
    });
  } catch(e){
    console.error('Load list error:', e);
    listEl.innerHTML = '<div class="no-clients">Error loading clients. Check Firebase config.</div>';
  }
}

/* =========================================================================
   LOAD SINGLE CLIENT
   ========================================================================= */
async function loadClient(docId){
  if(!db) return;
  try {
    const doc = await db.collection('clients').doc(docId).get();
    if(!doc.exists){ showToast('Client not found','error'); return; }
    deserializeState(doc.data());
    showToast(`"${doc.data().clientName}" loaded!`);
    window.scrollTo({ top: document.querySelector('.setup').offsetTop - 20, behavior: 'smooth' });
  } catch(e){
    console.error('Load error:', e);
    showToast('Load failed: ' + e.message, 'error');
  }
}

/* =========================================================================
   DELETE CLIENT
   ========================================================================= */
async function deleteClient(docId, name){
  if(!db) return;
  if(!confirm(`Delete "${name}"? This cannot be undone.`)) return;
  try {
    await db.collection('clients').doc(docId).delete();
    showToast(`"${name}" deleted`);
    loadClientList();
  } catch(e){
    console.error('Delete error:', e);
    showToast('Delete failed: ' + e.message, 'error');
  }
}

/* =========================================================================
   BOOT
   ========================================================================= */
if(initFirebase()) loadClientList();
</script>
